name: Douceur API CD

on:
  workflow_run:
    workflows: ["Douceur API CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-render:
    name: Deploy no Render
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Acionar Deploy Hook do Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          response=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")

          if [ "$response" != "200" ] && [ "$response" != "202" ]; then
            echo "Falha ao solicitar deploy no Render. HTTP: $response"
            exit 1
          fi

          echo "Solicitação de deploy aceita pelo Render. HTTP: $response"
